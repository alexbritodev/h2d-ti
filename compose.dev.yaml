# Ambiente de desenvolvimento. A produção terá arquivo próprio em infra/.
name: h2d-ti

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      H2D_DB_PASSWORD: ${H2D_DB_PASSWORD:?defina no .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?defina no .env}
    ports:
      # Só em 127.0.0.1: o banco nunca fica exposto à rede.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - h2d_pgdata:/var/lib/postgresql/data
      - ./infra/db/init/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
      - ./infra/db/init/02-dev-test-database.sh:/docker-entrypoint-initdb.d/02-dev-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d h2d"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
      target: dev
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://h2d:${H2D_DB_PASSWORD}@db:5432/h2d
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      COOKIE_SECURE: "false"
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-flash-lite-latest}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
      LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-200}
      GUARDIAO_ENABLED: ${GUARDIAO_ENABLED:-true}
      GUARDIAO_FAST_ONLY: ${GUARDIAO_FAST_ONLY:-false}
      GUARDIAO_MODEL: ${GUARDIAO_MODEL:-}
      VALIDADOR_ENABLED: ${VALIDADOR_ENABLED:-true}
      VALIDADOR_MODEL: ${VALIDADOR_MODEL:-}
      VALIDADOR_CONFIDENCE_THRESHOLD: ${VALIDADOR_CONFIDENCE_THRESHOLD:-0.7}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/h2d-events
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET:-hmac-de-desenvolvimento-local}
      TEST_DATABASE_URL: postgresql+asyncpg://h2d:${H2D_DB_PASSWORD}@db:5432/h2d_test
      # Escritório virtual (experimento): defina no .env para ligar.
      ESCRITORIO_VIRTUAL_ENABLED: ${ESCRITORIO_VIRTUAL_ENABLED:-false}
      ESCRITORIO_VIRTUAL_DEMO: ${ESCRITORIO_VIRTUAL_DEMO:-false}
      # No Docker com Windows, eventos de arquivo não chegam ao container.
      WATCHFILES_FORCE_POLLING: "true"
    command: sh -c "alembic upgrade head && uvicorn h2d.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src"
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    volumes:
      - ./apps/api:/app
      - h2d_uploads:/data/uploads
      - h2d_models:/models
    # Só fica saudável depois das migrações: "up --wait" seguido do seed não pode correr risco.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  # Processa a fila de ingestão (envia o documento, o worker gera os trechos e os vetores).
  worker:
    build:
      context: ./apps/api
      target: dev
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+asyncpg://h2d:${H2D_DB_PASSWORD}@db:5432/h2d
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      COOKIE_SECURE: "false"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/h2d-events
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET:-hmac-de-desenvolvimento-local}
    command: python -m h2d.worker
    volumes:
      - ./apps/api:/app
      - h2d_uploads:/data/uploads
      - h2d_models:/models
    depends_on:
      api:
        condition: service_healthy

  # Só com o perfil n8n: docker compose --profile n8n up -d. O e-mail vai para o Mailpit
  # (http://localhost:8025), nunca para a rua.
  n8n:
    profiles: [n8n]
    build:
      context: .
      dockerfile: n8n/Dockerfile
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?defina no .env}
      N8N_ENCRYPTION_KEY: chave-de-desenvolvimento-local
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      H2D_HMAC_SECRET: ${N8N_HMAC_SECRET:-hmac-de-desenvolvimento-local}
      H2D_BASE_URL: http://localhost:5173
      H2D_API_URL: http://api:8000
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      TI_LEADER_EMAIL: lider@h2d.local
      MAIL_FROM: h2d@h2d.local
      GENERIC_TIMEZONE: America/Sao_Paulo
    ports:
      - "127.0.0.1:${N8N_PORT:-5679}:5678"
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    profiles: [n8n]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"

  web:
    image: node:22-slim
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web:/app
      # Contrato da API, lido por "npm run gen:api" como ../api/openapi.json.
      - ./apps/api/openapi.json:/api/openapi.json:ro
      # node_modules do container não se mistura com o do Windows.
      - h2d_web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  h2d_pgdata:
  h2d_web_node_modules:
  h2d_uploads:
  h2d_models:
