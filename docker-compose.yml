# Stack de produção para o Portainer (Repository, branch main, "Compose path": docker-compose.yml).
# O Portainer faz o build a partir do Git. Os valores das variáveis ${...} ficam em
# "Environment variables" do stack, nunca no repositório (modelo em .env.example).
# O Caddy da VPS recebe o domínio, gera o HTTPS e encaminha para h2d-web:8080 pela rede "proxy".
# O desenvolvimento local usa compose.dev.yaml (o .env define COMPOSE_FILE), não este arquivo.
# Este é o único compose com nome padrão: um `docker compose` solto na VPS usa ESTE, nunca o de dev.
name: h2d

x-restart: &restart
  restart: unless-stopped

# API e worker usam a mesma imagem (o modelo de embeddings já vem dentro dela).
x-api-build: &api-build
  context: ./apps/api
  target: prod

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://h2d:${H2D_DB_PASSWORD}@db:5432/h2d
  JWT_SECRET: ${JWT_SECRET:?defina no Portainer}
  COOKIE_SECURE: "true"
  ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
  SEED_PASSWORD: ${SEED_PASSWORD:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Modelo de linguagem. O padrão é o roteador gratuito do OpenRouter, que escolhe ao acaso um
  # modelo gratuito disponível. Para mais estabilidade use um modelo pago barato, ex.:
  # anthropic/claude-haiku-5.5.
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
  OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-}
  # Teto de chamadas ao modelo por dia (todos os usuários). No OpenRouter gratuito são 50/dia
  # (1000 com US$ 10 em créditos). Padrão 200 evita bloqueio local prematuro em apresentações.
  LLM_DAILY_REQUEST_LIMIT: ${LLM_DAILY_REQUEST_LIMIT:-200}
  # Agentes do Chat (Guardião de Entrada e Validador de Resposta).
  GUARDIAO_ENABLED: ${GUARDIAO_ENABLED:-true}
  GUARDIAO_FAST_ONLY: ${GUARDIAO_FAST_ONLY:-false}
  GUARDIAO_MODEL: ${GUARDIAO_MODEL:-}
  VALIDADOR_ENABLED: ${VALIDADOR_ENABLED:-true}
  VALIDADOR_MODEL: ${VALIDADOR_MODEL:-}
  VALIDADOR_CONFIDENCE_THRESHOLD: ${VALIDADOR_CONFIDENCE_THRESHOLD:-0.7}
  # Integração com o n8n (rede interna). Sem o segredo, os eventos ficam na fila e nada é enviado.
  N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://h2d-n8n:5678/webhook/h2d-events}
  N8N_HMAC_SECRET: ${N8N_HMAC_SECRET:-}
  # Validade do link de convite, em horas (mínimo 24).
  INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-48}
  # Opcional: token do Hugging Face (gratuito) eleva o limite de download do modelo (erro 429).
  HF_TOKEN: ${HF_TOKEN:-}
  # Escritório virtual (experimento, docs/escritorio-virtual.md). Desligado por padrão: ligue com
  # ESCRITORIO_VIRTUAL_ENABLED=true nas variáveis do stack. A demo só vale com o recurso ligado.
  ESCRITORIO_VIRTUAL_ENABLED: ${ESCRITORIO_VIRTUAL_ENABLED:-false}
  ESCRITORIO_VIRTUAL_DEMO: ${ESCRITORIO_VIRTUAL_DEMO:-false}

services:
  db:
    <<: *restart
    # O script de init (cria os bancos h2d e n8n na primeira subida do volume) vai dentro da
    # imagem. Nada de bind mount com caminho relativo: no Portainer ele vira uma pasta vazia.
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    image: h2d-db:pg17
    pull_policy: build
    container_name: h2d-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no Portainer}
      H2D_DB_PASSWORD: ${H2D_DB_PASSWORD:?defina no Portainer}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?defina no Portainer}
    volumes:
      # pg17: o volume vai em /var/lib/postgresql/data (só o pg18 usa /var/lib/postgresql).
      - h2d_pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d h2d"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Estimativa. Medir com docker stats na F2 e ajustar.
    mem_limit: 1g

  api:
    <<: *restart
    container_name: h2d-api
    pull_policy: build
    image: h2d-api:prod
    build: *api-build
    environment: *api-env
    # As migrações são idempotentes e só adicionam: rodam a cada subida, antes da API.
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn h2d.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'
    expose:
      - "8000"
    volumes:
      - h2d_uploads:/data/uploads
      # Guarda o modelo de embeddings (baixado no build ou no primeiro uso) entre os redeploys.
      - h2d_models:/models
    networks: [interna]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # Guarda o modelo de embeddings na memória depois da primeira busca.
    mem_limit: 1g

  # Processa a fila de ingestão: lê o arquivo enviado, gera trechos e vetores e publica a versão.
  worker:
    <<: *restart
    container_name: h2d-worker
    pull_policy: build
    image: h2d-api:prod
    build: *api-build
    environment: *api-env
    command: ["python", "-m", "h2d.worker"]
    volumes:
      - h2d_uploads:/data/uploads
      # Guarda o modelo de embeddings (baixado no build ou no primeiro uso) entre os redeploys.
      - h2d_models:/models
    networks: [interna]
    depends_on:
      api:
        condition: service_healthy
    # Medido no desenvolvimento: ~970 MB com o modelo carregado. Ajustar com docker stats na VPS.
    mem_limit: 1536m

  web:
    <<: *restart
    container_name: h2d-web
    pull_policy: build
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    expose:
      - "8080"
    networks: [proxy, interna]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m

  n8n:
    <<: *restart
    # Versão fixa (ver n8n/Dockerfile): a imagem leva os workflows do projeto.
    pull_policy: build
    image: h2d-n8n:2.32.5
    build:
      context: .
      dockerfile: n8n/Dockerfile
    container_name: h2d-n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina no Portainer}
      N8N_HOST: ${N8N_DOMAIN:?defina no Portainer}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      # Atrás de um proxy (o Caddy da VPS). WEBHOOK_URL vale até a 2.34; N8N_WEBHOOK_URL, da 2.35 em diante.
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_WEBHOOK_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Os workflows do H2D conferem o HMAC e leem estas variáveis. O editor é privado (só admin).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      H2D_HMAC_SECRET: ${N8N_HMAC_SECRET:-}
      H2D_API_URL: http://h2d-api:8000
      # Poda do histórico: guarda só as execuções com erro e por 7 dias.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      H2D_BASE_URL: ${H2D_BASE_URL:-}
      TI_LEADER_EMAIL: ${TI_LEADER_EMAIL:-}
      MAIL_FROM: ${MAIL_FROM:-h2d@localhost}
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    # Na rede "proxy" só para o Caddy da VPS alcançar o editor, se você decidir expô-lo.
    networks: [proxy, interna]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

networks:
  proxy:
    external: true
  interna:

volumes:
  h2d_pgdata:
  h2d_uploads:
  h2d_models:
  n8n_data:
